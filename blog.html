<script src="main.js" defer></script>

<script>
async function loadPosts() {
    const container = document.getElementById("substack-posts");
    if (!container) return;

    try {
        const response = await fetch("data/posts.json");
        if (!response.ok) throw new Error("Unable to load posts");

        const posts = await response.json();

        if (!posts.length) {
            container.innerHTML = "<p>No writing available yet.</p>";
            return;
        }

        container.innerHTML = posts.map(post => {
            const date = new Date(post.published).toLocaleDateString("en-GB", {
                day: "numeric",
                month: "long",
                year: "numeric"
            });

            const excerpt = (post.summary || "")
                .replace(/<[^>]*>/g, "")
                .replace(/\s+/g, " ")
                .trim()
                .slice(0, 240);

            return `
                <a class="post" href="${post.link}" target="_blank" rel="noopener">
                    <span class="date">${date}</span>
                    <h3>${post.title}</h3>
                    <p>${excerpt}...</p>
                </a>
            `;
        }).join("");
    } catch (error) {
        container.innerHTML = `
            <p>
                Unable to load writing.
                <a href="https://saumyaaanchal.substack.com" target="_blank" rel="noopener">
                    Visit Substack →
                </a>
            </p>
        `;
    }
}
loadPosts();
</script>
